syntax = "proto3";

package vercel.sandbox.spawn.v1;

// SpawnService is the control-plane API served by sandbox-init (PID 1)
// over ConnectRPC (h2c + protobuf) on /run/vercel/share/init.sock.
// Connect paths follow /<package>.<Service>/<Method>.
service SpawnService {
  // Spawn a process. Server-streaming: the server sends SpawnEvent
  // messages (SpawnStarted, then ExitStatus) until the process exits.
  rpc Spawn(SpawnRequest) returns (stream SpawnEvent);

  // Write bytes to a spawned process's stdin. Returns bytes written.
  rpc Stdin(StdinRequest) returns (StdinResponse);

  // Kill a spawned process.
  rpc Kill(KillRequest) returns (KillResponse);

  // Health check.
  rpc Ping(PingRequest) returns (PingResponse);

  // Interactive PTY session. Bidirectional streaming.
  // Method name inferred from PtyInput/PtyOutput (Tier 2).
  rpc Pty(stream PtyInput) returns (stream PtyOutput);

  // Enable signed git (commit signing) inside the sandbox.
  rpc EnableSignedGit(EnableSignedGitRequest) returns (EnableSignedGitResponse);
}

// SpawnRequest: no fields were observed in binary strings.
// The real request carries the command and its execution context;
// those fields are unknown. Body left empty rather than guessed.
message SpawnRequest {}

// SpawnEvent carries one event in the Spawn stream.
message SpawnEvent {
  oneof event {
    // Field numbers are placeholders, not verified.
    SpawnStarted started = 1;
    ExitStatus exit_status = 2;
  }
}

// SpawnStarted: no fields were observed in binary strings.
message SpawnStarted {}

// ExitStatus: no fields were observed in binary strings.
// The real message carries the process exit status; its fields
// are unknown. Body left empty rather than guessed.
message ExitStatus {}

// StdinRequest: no fields were observed in binary strings.
message StdinRequest {}

// StdinResponse. bytes_written is the one field number verified
// from the binary strings (varint, field 1).
message StdinResponse {
  uint64 bytes_written = 1;
}

// KillRequest: no fields were observed in binary strings.
message KillRequest {}

// KillResponse: no fields were observed in binary strings.
message KillResponse {}

// PingRequest: no fields were observed in binary strings.
message PingRequest {}

// PingResponse: no fields were observed in binary strings.
message PingResponse {}

// PtyInput carries one input in the Pty bidi stream.
// The oneof is named "input" (observed). Members and field numbers
// are placeholders except for the named message types, which were
// observed. The `bytes data` member is inferred (a PTY stream
// carries raw bytes); it was not directly observed.
message PtyInput {
  oneof input {
    PtyStart start = 1;
    PtyResize resize = 2;
    bytes data = 3;
  }
}

// PtyOutput carries one output in the Pty bidi stream.
// The oneof is named "output" (observed). Members and field numbers
// are placeholders except for the named message type, which was
// observed. The `bytes data` member is inferred.
message PtyOutput {
  oneof output {
    PtyStarted started = 1;
    bytes data = 2;
